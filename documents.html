<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Documents - KYEB</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#f0f2f5; font-family:Arial;}
.container{max-width:900px;margin:20px auto;background:white;padding:25px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.1);}
.top-line{height:6px;background:#cc0000;border-radius:10px;margin-bottom:15px;}
h1{color:#003366;}
.upload-box{background:#f8f9fa;border:2px dashed #003366;padding:20px;border-radius:10px;margin:20px 0; text-align:left;}
input,select{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:5px;}
.btn{background:#003366;color:white;padding:12px;border:none;width:100%;border-radius:5px;font-weight:bold;cursor:pointer;}
.btn-green{background:#28a745;}
.doc-card{background:white;border-left:5px solid #003366;padding:15px;margin-bottom:12px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.05);display:flex;justify-content:space-between;align-items:center;}
.badge{padding:3px 8px;border-radius:10px;color:white;font-size:11px;}
</style>
</head>
<body>
<div class="container">
<div class="top-line"></div>
<h1>📄 HR Documents - KYEB</h1>
<p>Logged in as: <b id="userName"></b> | <span id="userDept"></span></p>
<a href="dashboard.html" style="color:#cc0000;">← Back to Dashboard</a>

<div id="uploadSection" class="upload-box" style="display:none;">
<h3>Upload New Document (HR Only)</h3>
<input type="text" id="docTitle" placeholder="Document Title e.g. Leave Policy 2024">
<select id="docCategory"><option>HR Policy</option><option>Leave Forms</option><option>Staff Handbook</option><option>Circulars</option><option>Finance Forms</option></select>
<input type="file" id="docFile">
<button class="btn" onclick="uploadDoc()">Upload Document</button>
</div>

<h3 style="margin-top:30px;">Available Documents (<span id="docCount">0</span>)</h3>
<div id="docList"></div>
</div>

<script>
let name = localStorage.getItem('kyeb_name') || 'Guest';
let dept = localStorage.getItem('kyeb_dept') || '';
document.getElementById('userName').innerText = name;
document.getElementById('userDept').innerText = dept;

// Show upload only for HR
if(dept === 'HR'){
  document.getElementById('uploadSection').style.display='block';
}

function uploadDoc(){
 let title = document.getElementById('docTitle').value;
 let cat = document.getElementById('docCategory').value;
 let fileInput = document.getElementById('docFile');
 if(!title){alert('Enter title'); return;}

 let fileName = fileInput.files[0]? fileInput.files[0].name : title + '.pdf';
 let size = fileInput.files[0]? (fileInput.files[0].size/1024).toFixed(1)+' KB' : '250 KB';

 let docs = JSON.parse(localStorage.getItem('kyeb_documents')||'[]');
 docs.push({
   id: Date.now(),
   title: title,
   category: cat,
   fileName: fileName,
   size: size,
   uploadedBy: name,
   date: new Date().toLocaleDateString()
 });
 localStorage.setItem('kyeb_documents', JSON.stringify(docs));
 alert('Document uploaded!');
 document.getElementById('docTitle').value='';
 loadDocs();
}

function loadDocs(){
 let docs = JSON.parse(localStorage.getItem('kyeb_documents')||'[]');
 document.getElementById('docCount').innerText = docs.length;
 let div = document.getElementById('docList');
 if(docs.length===0){
   div.innerHTML = '<p style="color:gray;">No documents yet. HR will upload here.</p>';
   // Add default docs for demo if empty
   let defaults = [
     {id:1,title:'KYEB Leave Policy 2024',category:'HR Policy',fileName:'Leave_Policy_2024.pdf',size:'1.2 MB',uploadedBy:'HR Office',date:'2024-01-15'},
     {id:2,title:'Staff Code of Conduct',category:'Staff Handbook',fileName:'Code_of_Conduct.pdf',size:'850 KB',uploadedBy:'HR Office',date:'2024-02-10'},
     {id:3,title:'Imprest Request Form',category:'Finance Forms',fileName:'Imprest_Form.xlsx',size:'45 KB',uploadedBy:'Finance',date:'2024-03-01'}
   ];
   localStorage.setItem('kyeb_documents', JSON.stringify(defaults));
   docs = defaults;
   document.getElementById('docCount').innerText = docs.length;
 }

 let h='';
 docs.reverse().forEach(d=>{
   let col = d.category==='HR Policy'?'#003366':d.category==='Finance Forms'?'#28a745':'#cc0000';
   h+=`<div class="doc-card">
     <div style="text-align:left;">
       <b>📄 ${d.title}</b><br>
       <small><span class="badge" style="background:${col}">${d.category}</span> ${d.fileName} • ${d.size} • Uploaded by ${d.uploadedBy} on ${d.date}</small>
     </div>
     <div>
       <button class="btn btn-green" style="padding:8px 15px;width:auto;" onclick="downloadDoc('${d.title}')">Download</button>
     </div>
   </div>`;
 });
 div.innerHTML=h;
}

function downloadDoc(title){
 alert('Downloading: '+title+'\n\nIn real system, this will download the actual file. For demo, file is stored in localStorage.');
}

loadDocs();
</script>
</body>
</html>
