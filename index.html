<!DOCTYPE html>
<html>
<head>
<title>KYEB Staff Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
<h1>KYEB Portal</h1>
<p>Kenya Yearbook Editorial Board</p>
<input type="email" id="email" placeholder="Enter email">
<input type="password" id="password" placeholder="Enter password">
<button onclick="doLogin()">Login</button>
<p style="margin-top:15px;font-size:12px;color:#666;">Staff: use any email<br>Admin: admin@kenyayearbook.go.ke / admin123</p>
</div>

<script>
function doLogin(){
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value.trim();

  if(email === '' || pass === ''){
    alert('Please enter email and password');
    return;
  }

  if(email === 'admin@kenyayearbook.go.ke' && pass === 'KYEB2023!Admin'){
    localStorage.setItem('kyeb_user', email);
    localStorage.setItem('kyeb_role', 'admin');
    window.location.href = 'admin.html';
  } else {
    localStorage.setItem('kyeb_user', email);
    localStorage.setItem('kyeb_role', 'staff');
    window.location.href = 'dashboard.html';
  }
}
</script>
</body>
</html>
